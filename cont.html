<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact | Dany Drummer</title>

  <link rel="icon" href="https://imgs.search.brave.com/cxrra9e2OP7r6lZV61g7_3MD09zel7UkcqhNJ2MX9Jk/rs:fit:500:0:1:0/g:ce/aHR0cHM6Ly93d3cu/bHVkd2lnLWRydW1z/LmNvbS9hcHBsaWNh/dGlvbi9maWxlcy82/OTE0LzYzNTEvNDE0/MC90aHVtYi1zbmFy/ZXMtbGVnYWN5Lmpw/Zw">
  <style>
    /* --- CORE VARIABLES --- */
    :root {
      --primary: #00f2ff;   
      --secondary: #bd00ff;
      --dark: #050508;
      --surface: rgba(255, 255, 255, 0.03);
      --border: rgba(255, 255, 255, 0.1);
      --text: #ffffff;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      background-color: var(--dark);
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 15% 50%, rgba(112, 0, 255, 0.15), transparent 40%),
        radial-gradient(circle at 85% 30%, rgba(0, 242, 255, 0.15), transparent 40%);
    }

    /* --- NAVIGATION --- */
    .navbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 5%;
      background: rgba(5, 5, 8, 0.8);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      z-index: 1000;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 15px;
      text-decoration: none;
    }

    .brand img {
      width: 45px; height: 45px;
      border-radius: 12px;
      border: 1px solid var(--primary);
    }

    .brand-text {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.4rem;
      font-weight: 700;
      color: #fff;
    }

    .nav-links {
      display: flex;
      gap: 2rem;
      list-style: none;
    }

    .nav-links a {
      color: rgba(255,255,255,0.7);
      text-decoration: none;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: 0.3s;
    }

    .nav-links a:hover, .nav-links a.active { color: var(--primary); text-shadow: 0 0 10px var(--primary); }
    .menu-btn { display: none; background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; }

    /* --- CONTACT LAYOUT --- */
    .contact-container {
      min-height: 100vh;
      padding-top: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-bottom: 50px;
    }

    .contact-wrapper {
      width: 100%;
      max-width: 1200px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4rem;
      padding: 0 5%;
    }

    /* --- LEFT SIDE: INFO --- */
    .contact-info {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .contact-info h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 3.5rem;
      line-height: 1.1;
      margin-bottom: 1.5rem;
    }

    .contact-info p {
      font-size: 1.1rem;
      color: rgba(255,255,255,0.6);
      margin-bottom: 2.5rem;
      line-height: 1.6;
    }

    .info-item {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 1.5rem;
      font-size: 1.1rem;
    }

    .info-item i {
      width: 40px; height: 40px;
      background: rgba(255,255,255,0.05);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
      border: 1px solid var(--border);
    }

    .info-item a {
      color: #fff;
      text-decoration: none;
      transition: 0.3s;
    }
    .info-item a:hover { color: var(--primary); }

    /* --- RIGHT SIDE: FORM --- */
    .contact-form-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 3rem;
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    }

    .form-group {
      margin-bottom: 1.5rem;
      position: relative;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.9rem;
      color: rgba(255,255,255,0.7);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .form-control {
      width: 100%;
      padding: 15px 20px;
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: #fff;
      font-family: 'Outfit', sans-serif;
      font-size: 1rem;
      transition: 0.3s;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 15px rgba(0, 242, 255, 0.1);
    }

    textarea.form-control {
      resize: vertical;
      min-height: 150px;
    }

    /* Submit Button */
    .submit-btn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      transition: 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(0, 242, 255, 0.3);
    }

    .submit-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    /* --- RESPONSIVE --- */
    @media (max-width: 900px) {
      .contact-wrapper { grid-template-columns: 1fr; gap: 3rem; }
      .contact-info h1 { font-size: 2.5rem; }
      .contact-form-card { padding: 2rem; }
    }

    @media (max-width: 768px) {
      .nav-links { display: none; position: fixed; top: 80px; left: 0; right: 0; bottom: 0; background: #050508; flex-direction: column; justify-content: center; align-items: center; gap: 2rem; font-size: 1.5rem; }
      .nav-links.active { display: flex; }
      .menu-btn { display: block; z-index: 1001; }
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <nav class="navbar">
    <a href="church.html" class="brand">
      <img src="https://imgs.search.brave.com/cxrra9e2OP7r6lZV61g7_3MD09zel7UkcqhNJ2MX9Jk/rs:fit:500:0:1:0/g:ce/aHR0cHM6Ly93d3cu/bHVkd2lnLWRydW1z/LmNvbS9hcHBsaWNh/dGlvbi9maWxlcy82/OTE0LzYzNTEvNDE0/MC90aHVtYi1zbmFy/ZXMtbGVnYWN5Lmpw/Zw" alt="Logo">
      <span class="brand-text">DANY DRUMMER</span>
    </a>

    <button class="menu-btn" onclick="toggleMenu()">
      <i class="fa-solid fa-bars"></i>
    </button>

    <ul class="nav-links" id="navLinks">
      <li><a href="church.html">Home</a></li>
      <li><a href="liv.html">Live</a></li>
      <li><a href="gllery.html">Gallery</a></li>
      <li><a href="cont.html" class="active">Contact</a></li>
    </ul>
  </nav>

  <!-- Contact Section -->
  <div class="contact-container">
    <div class="contact-wrapper">
      
      <!-- Left Side: Info -->
      <div class="contact-info">
        <h1>Let's Make <br><span style="color:var(--primary)">Noise Together</span></h1>
        <p>Have a question, want to book a session, or just want to say hello? Drop me a message below.</p>
        
        <div class="info-item">
          <i class="fa-solid fa-envelope"></i>
          <a href="mailto:jrodsurvan@gmail.com">jrodsurvan@gmail.com</a>
        </div>
        
        <div class="info-item">
          <i class="fa-solid fa-location-dot"></i>
          <span>Christchurch, New Zealand</span>
        </div>

        <!-- Modern Social Icons -->
        <div style="display: flex; gap: 15px; margin-top: 2rem;">
            <a href="#" class="mod-icon" style="width:50px; height:50px; border-radius:12px; background:rgba(255,255,255,0.05); display:flex; align-items:center; justify-content:center; color:#fff; text-decoration:none; border:1px solid var(--border); transition:0.3s;" onmouseover="this.style.borderColor='#1877F2'; this.style.color='#1877F2'" onmouseout="this.style.borderColor='var(--border)'; this.style.color='#fff'">
                <i class="fa-brands fa-facebook-f"></i>
            </a>
            <a href="#" class="mod-icon" style="width:50px; height:50px; border-radius:12px; background:rgba(255,255,255,0.05); display:flex; align-items:center; justify-content:center; color:#fff; text-decoration:none; border:1px solid var(--border); transition:0.3s;" onmouseover="this.style.borderColor='#C13584'; this.style.color='#C13584'" onmouseout="this.style.borderColor='var(--border)'; this.style.color='#fff'">
                <i class="fa-brands fa-instagram"></i>
            </a>
            <a href="#" class="mod-icon" style="width:50px; height:50px; border-radius:12px; background:rgba(255,255,255,0.05); display:flex; align-items:center; justify-content:center; color:#fff; text-decoration:none; border:1px solid var(--border); transition:0.3s;" onmouseover="this.style.borderColor='#FF0000'; this.style.color='#FF0000'" onmouseout="this.style.borderColor='var(--border)'; this.style.color='#fff'">
                <i class="fa-brands fa-youtube"></i>
            </a>
        </div>
      </div>

      <!-- Right Side: Form -->
      <div class="contact-form-card">
        <!-- 
           SETUP: Replace 'YOUR_FORMSPREE_URL_HERE' with your link 
           Example: action="https://formspree.io/f/xvngwbzl"
        -->
        <form id="contactForm" action="YOUR_FORMSPREE_URL_HERE" method="POST">
          
          <div class="form-group">
            <label for="name">Your Name</label>
            <input type="text" id="name" name="name" class="form-control" placeholder="John Doe" required>
          </div>

          <div class="form-group">
            <label for="email">Your Email</label>
            <input type="email" id="email" name="email" class="form-control" placeholder="john@example.com" required>
          </div>

          <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" name="message" class="form-control" placeholder="I want to book you for..." required></textarea>
          </div>

          <button type="submit" class="submit-btn" id="submitBtn">
            <span>Send Message</span>
            <i class="fa-solid fa-paper-plane"></i>
          </button>

        </form>
      </div>

    </div>
  </div>

  <script>
    // 1. Mobile Menu Toggle
    function toggleMenu() {
      const nav = document.getElementById('navLinks');
      const icon = document.querySelector('.menu-btn i');
      nav.classList.toggle('active');
      if (nav.classList.contains('active')) {
        icon.classList.remove('fa-bars');
        icon.classList.add('fa-xmark');
      } else {
        icon.classList.remove('fa-xmark');
        icon.classList.add('fa-bars');
      }
    }

    // 2. Form Handling (AJAX)
    var form = document.getElementById("contactForm");
    
    if(form) {
      async function handleSubmit(event) {
        event.preventDefault();
        var btn = document.getElementById("submitBtn");
        var btnText = btn.querySelector("span");
        var btnIcon = btn.querySelector("i");
        var originalText = btnText.innerText;
        var originalIcon = btnIcon.className;

        // Set Loading State
        btn.disabled = true;
        btnText.innerText = "Sending...";
        btnIcon.className = "fa-solid fa-spinner fa-spin";

        var data = new FormData(event.target);

        fetch(event.target.action, {
          method: form.method,
          body: data,
          headers: { 'Accept': 'application/json' }
        }).then(response => {
          if (response.ok) {
            // Success State
            btnText.innerText = "Sent!";
            btnIcon.className = "fa-solid fa-check";
            btn.style.background = "#00c851"; // Green
            
            // Clear Form
            form.reset();

            // Reset Button after 3 seconds
            setTimeout(() => {
              btnText.innerText = originalText;
              btnIcon.className = originalIcon;
              btn.style.background = ""; // Reset gradient
              btn.disabled = false;
            }, 3000);

          } else {
            // Error State
            btnText.innerText = "Error";
            btnIcon.className = "fa-solid fa-triangle-exclamation";
            btn.style.background = "#ff4444"; // Red
            btn.disabled = false;
            
            setTimeout(() => {
              btnText.innerText = originalText;
              btnIcon.className = originalIcon;
              btn.style.background = "";
            }, 3000);
          }
        }).catch(error => {
          // Network Error
          btnText.innerText = "Error";
          btnIcon.className = "fa-solid fa-triangle-exclamation";
          btn.style.background = "#ff4444";
          btn.disabled = false;
        });
      }

      form.addEventListener("submit", handleSubmit);
    }
  </script>
</body>
</html>
