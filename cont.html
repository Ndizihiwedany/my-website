<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dany Drummer</title>
<link rel="icon" href="https://imgs.search.brave.com/cxrra9e2OP7r6lZV61g7_3MD09zel7UkcqhNJ2MX9Jk/rs:fit:500:0:1:0/g:ce/aHR0cHM6Ly93d3cu/bHVkd2lnLWRydW1z/LmNvbS9hcHBsaWNh/dGlvbi9maWxlcy82/OTE0LzYzNTEvNDE0/MC90aHVtYi1zbmFy/ZXMtbGVnYWN5Lmpw/Zw">
  <style>
   
    :root {
      --primary: #00f2ff;   
      --secondary: #bd00ff;
      --dark: #050508;
      --surface: rgba(255, 255, 255, 0.03);
      --border: rgba(255, 255, 255, 0.1);
      --text: #ffffff;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      background-color: var(--dark);
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
      background-image: 
        radial-gradient(circle at 15% 50%, rgba(112, 0, 255, 0.15), transparent 40%),
        radial-gradient(circle at 85% 30%, rgba(0, 242, 255, 0.15), transparent 40%);
    }

   
    .navbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 5%;
      background: rgba(5, 5, 8, 0.8);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      z-index: 1000;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 15px;
      text-decoration: none;
    }

    .brand img {
      width: 45px; height: 45px;
      border-radius: 12px;
      border: 1px solid var(--primary);
    }

    .brand-text {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.4rem;
      font-weight: 700;
      color: #fff;
    }

    .nav-links {
      display: flex;
      gap: 2rem;
      list-style: none;
    }

    .nav-links a {
      color: rgba(255,255,255,0.7);
      text-decoration: none;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: 0.3s;
    }

    .nav-links a:hover, .nav-links a.active { color: var(--primary); text-shadow: 0 0 10px var(--primary); }
    .menu-btn { display: none; background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; }

    
    .contact-wrapper {
      padding-top: 120px;
      max-width: 1000px;
      margin: 0 auto;
      padding-left: 5%;
      padding-right: 5%;
      padding-bottom: 4rem;
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 2rem;
      height: calc(100vh - 80px);
    }

    
    .profile-card {
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2rem;
      text-align: center;
      height: fit-content;
    }

    .profile-pic {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      margin: 0 auto 1.5rem;
      border: 3px solid var(--primary);
      box-shadow: 0 0 20px rgba(0, 242, 255, 0.2);
      object-fit: cover;
    }

    .profile-name {
      font-family: 'Space Grotesk';
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .profile-handle {
      color: var(--primary);
      font-size: 0.9rem;
      margin-bottom: 2rem;
    }

    .social-mini {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-top: 1.5rem;
    }

    .social-mini a {
      color: rgba(255,255,255,0.5);
      font-size: 1.2rem;
      transition: 0.3s;
    }
    .social-mini a:hover { color: var(--primary); transform: scale(1.2); }

   
    .chat-interface {
      background: rgba(10, 10, 15, 0.6);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      height: 100%;
      max-height: 700px;
    }

    .chat-header {
      padding: 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .status-dot {
      width: 10px; height: 10px;
      background: #0f0;
      border-radius: 50%;
      box-shadow: 0 0 10px #0f0;
    }

   
    .form-container {
      flex: 1;
      padding: 30px;
      overflow-y: auto;
    }

    .input-group { margin-bottom: 1.5rem; }
    
    .input-group label {
      display: block;
      margin-bottom: 8px;
      color: rgba(255,255,255,0.6);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .custom-input, .custom-textarea {
      width: 100%;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 15px;
      color: #fff;
      font-family: inherit;
      font-size: 1rem;
      transition: 0.3s;
    }

    .custom-input:focus, .custom-textarea:focus {
      outline: none;
      border-color: var(--primary);
      background: rgba(0, 242, 255, 0.05);
      box-shadow: 0 0 15px rgba(0, 242, 255, 0.1);
    }

    .custom-textarea {
      resize: vertical;
      min-height: 150px;
    }

    .send-btn {
      width: 100%;
      padding: 15px;
      background: var(--primary);
      color: #000;
      border: none;
      border-radius: 50px;
      font-weight: 700;
      font-size: 1rem;
      text-transform: uppercase;
      cursor: pointer;
      transition: 0.3s;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }

    .send-btn:hover {
      background: #fff;
      box-shadow: 0 0 20px var(--primary);
      transform: translateY(-2px);
    }

   
    #form-message {
      margin-top: 15px;
      text-align: center;
      font-weight: 600;
      display: none;
    }
    .success { color: #0f0; }
    .error { color: #ff0055; }

    
    @media (max-width: 768px) {
      .contact-wrapper { grid-template-columns: 1fr; height: auto; }
      .nav-links { display: none; position: fixed; top: 80px; left: 0;
         right: 0; bottom: 0; background: #050508; flex-direction: column;
          justify-content: center; align-items: center; gap: 2rem; font-size: 1.5rem; }
      .nav-links.active { display: flex; }
      .menu-btn { display: block; z-index: 1001; }
      .chat-interface { max-height: 600px; }
    }
  </style>
</head>
<body>

  
  <nav class="navbar">
    <a href="exe.html" class="brand">
      <img src="https://imgs.search.brave.com/cxrra9e2OP7r6lZV61g7_3MD09zel7UkcqhNJ2MX9Jk/rs:fit:500:0:1:0/g:ce/aHR0cHM6Ly93d3cu/bHVkd2lnLWRydW1z/LmNvbS9hcHBsaWNh/dGlvbi9maWxlcy82/OTE0LzYzNTEvNDE0/MC90aHVtYi1zbmFy/ZXMtbGVnYWN5Lmpw/Zw">
      <span class="brand-text">DANY DRUMMER</span>
    </a>

    <button class="menu-btn" onclick="toggleMenu()">
      <i class="fa-solid fa-bars"></i>
    </button>

    <ul class="nav-links" id="navLinks">
      <li><a href="church.html">Home</a></li>
      <li><a href="liv.html">Live</a></li>
      <li><a href="gllery.html">Gallery</a></li>
      <li><a href="cont.html" class="active">Contact</a></li>
    </ul>
  </nav>

  
  <div class="contact-wrapper">
    
    
    <div class="profile-card">
      <img src="/home/jrodsurvan/Public/Pictures/PXL_20250827_133813172.NIGHT-1-1.jpg" style="width: 200px;
      border-radius: 100px; border: 3px solid gray; height: 200px;">
      <h2 class="profile-name">Dany Drummer</h2>
      <p class="profile-handle">@jrodsurvan</p>
      
      <p style="color:rgba(255,255,255,0.6); font-size:0.9rem; line-height:1.6;">
        Send me a message directly here for bookings, collaborations, or just to say hello!
      </p>

      <div class="social-mini">
        <a href="https://facebook.com/survanjrod"><i class="fa-brands fa-facebook"></i></a>
        <a href="https://instagram.com/jrodsurvan"><i class="fa-brands fa-instagram"></i></a>
        <a href="https://youtube.com/jrodsurvan"><i class="fa-brands fa-youtube"></i></a>
      </div>
    </div>

    
    <div class="chat-interface">
      <div class="chat-header">
        <div class="status-dot"></div>
        <div>
          <h3 style="font-weight:700;">Direct Message</h3>
          <p style="font-size:0.8rem; color:rgba(255,255,255,0.5);">Messages go to: jrodsurvan@gmail.com</p>
        </div>
      </div>

      <div class="form-container">
        
        
        <form id="contact-form" action="https://formspree.io/f/YOUR_FORMSPREE_ID_HERE" method="POST">
          
          <div class="input-group">
            <label>Your Name</label>
            <input type="text" name="name" class="custom-input" placeholder="Enter your name" required>
          </div>

          <div class="input-group">
            <label>Your Email</label>
            <input type="email" name="email" class="custom-input" placeholder="Enter your email" required>
          </div>

          <div class="input-group">
            <label>Comment</label>
            <input type="text" name="comment" class="custom-input" placeholder="Short comment or subject" required>
          </div>

          <div class="input-group">
            <label>Message</label>
            <textarea name="message" class="custom-textarea" placeholder="Type your full message here..." required></textarea>
          </div>

          <button type="submit" class="send-btn" id="submitBtn">
            Send Message <i class="fa-solid fa-paper-plane"></i>
          </button>

          <div id="form-message"></div>
        </form>

      </div>
    </div>

  </div>

  <script>
  
    function toggleMenu() {
      const nav = document.getElementById('navLinks');
      const icon = document.querySelector('.menu-btn i');
      nav.classList.toggle('active');
      if (nav.classList.contains('active')) {
        icon.classList.remove('fa-bars');
        icon.classList.add('fa-xmark');
      } else {
        icon.classList.remove('fa-xmark');
        icon.classList.add('fa-bars');
      }
    }


    var form = document.getElementById("contact-form");
    
    async function handleSubmit(event) {
      event.preventDefault(); 
      
    
      if(form.action.includes("YOUR_FORMSPREE_ID_HERE")) {
        alert("Please configure the Formspree ID in the code first!");
        return;
      }

      var status = document.getElementById("form-message");
      var data = new FormData(event.target);
      var btn = document.getElementById("submitBtn");
      
      
      const originalText = btn.innerHTML;
      btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Sending...';
      btn.style.opacity = "0.7";

      fetch(form.action, {
        method: form.method,
        body: data,
        headers: {
            'Accept': 'application/json'
        }
      }).then(response => {
        if (response.ok) {
          status.innerHTML = "Thanks! Message sent to jrodsurvan@gmail.com.";
          status.className = "success";
          status.style.display = "block";
          form.reset();
          btn.innerHTML = '<i class="fa-solid fa-check"></i> Sent!';
          btn.style.background = "#0f0";
          btn.style.color = "#000";
        } else {
          response.json().then(data => {
            if (Object.hasOwn(data, 'errors')) {
              status.innerHTML = data["errors"].map(error => error["message"]).join(", ");
            } else {
              status.innerHTML = "Oops! There was a problem submitting your form";
            }
            status.className = "error";
            status.style.display = "block";
            btn.innerHTML = originalText;
            btn.style.opacity = "1";
          })
        }
      }).catch(error => {
        status.innerHTML = "Oops! There was a problem submitting your form";
        status.className = "error";
        status.style.display = "block";
        btn.innerHTML = originalText;
        btn.style.opacity = "1";
      });
    }

    form.addEventListener("submit", handleSubmit);
  </script>
</body>
</html>
