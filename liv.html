<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dany Drummer</title>

  <link rel="icon" href="https://imgs.search.brave.com/cxrra9e2OP7r6lZV61g7_3MD09zel7UkcqhNJ2MX9Jk/rs:fit:500:0:1:0/g:ce/aHR0cHM6Ly93d3cu/bHVkd2lnLWRydW1z/LmNvbS9hcHBsaWNh/dGlvbi9maWxlcy82/OTE0LzYzNTEvNDE0/MC90aHVtYi1zbmFy/ZXMtbGVnYWN5Lmpw/Zw">
  <style>
    
    :root {
      --primary: #00f2ff;   
      --secondary: #bd00ff;
      --dark: #050508;
      --surface: rgba(255, 255, 255, 0.03);
      --border: rgba(255, 255, 255, 0.1);
      --text: #ffffff;
      --red-live: #ff0000;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      background-color: var(--dark);
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 15% 50%, rgba(112, 0, 255, 0.15), transparent 40%),
        radial-gradient(circle at 85% 30%, rgba(0, 242, 255, 0.15), transparent 40%);
    }


    .navbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 5%;
      background: rgba(5, 5, 8, 0.8);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      z-index: 1000;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 15px;
      text-decoration: none;
    }

    .brand img {
      width: 45px; height: 45px;
      border-radius: 12px;
      border: 1px solid var(--primary);
    }

    .brand-text {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.4rem;
      font-weight: 700;
      color: #fff;
    }

    .nav-links {
      display: flex;
      gap: 2rem;
      list-style: none;
    }

    .nav-links a {
      color: rgba(255,255,255,0.7);
      text-decoration: none;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: 0.3s;
    }

    .nav-links a:hover, .nav-links a.active { color: var(--primary); text-shadow: 0 0 10px var(--primary); }
    .menu-btn { display: none; background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; }


    .live-container {
      padding-top: 100px; 
      max-width: 1600px;
      margin: 0 auto;
      padding-left: 5%;
      padding-right: 5%;
      padding-bottom: 4rem;
    }

    .live-grid {
      display: grid;
      grid-template-columns: 1fr 350px; 
      gap: 2rem;
      margin-bottom: 4rem;
    }

    
    .video-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      background: #000;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 0 50px rgba(0, 242, 255, 0.05);
    }

    #local-video-player {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none; 
    }

    #stream-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background: #111;
      color: #444;
    }

    .live-badge {
      position: absolute;
      top: 20px;
      left: 20px;
      background: var(--red-live);
      color: #fff;
      padding: 5px 12px;
      border-radius: 4px;
      font-weight: 800;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 10;
      box-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
      animation: pulseRed 2s infinite;
    }

    .live-dot { width: 8px; height: 8px; background: #fff; border-radius: 50%; }

    @keyframes pulseRed {
      0% { box-shadow: 0 0 0 0 rgba(255, 0, 0, 0.7); }
      70% { box-shadow: 0 0 0 10px rgba(255, 0, 0, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 0, 0, 0); }
    }

    
    .stream-info { margin-top: 1.5rem; }

    .stream-title {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: #fff;
    }

    .stream-meta {
      display: flex;
      gap: 1.5rem;
      color: rgba(255,255,255,0.6);
      font-size: 0.95rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .view-count { color: var(--red-live); font-weight: 600; }

    .broadcast-btn {
      background: rgba(255,255,255,0.1);
      border: 1px solid var(--primary);
      color: var(--primary);
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
      text-transform: uppercase;
      font-weight: 700;
      transition: 0.3s;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .broadcast-btn:hover { background: var(--primary); color: #000; box-shadow: 0 0 15px var(--primary); }

  
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(5px);
      z-index: 2000;
      display: none; 
      align-items: center;
      justify-content: center;
    }

    .modal-box {
      background: #111;
      border: 1px solid var(--border);
      padding: 2rem;
      border-radius: 16px;
      width: 90%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 0 30px rgba(0, 242, 255, 0.1);
      position: relative;
    }

    .modal-box h3 { margin-bottom: 1.5rem; color: #fff; font-family: 'Space Grotesk'; }

    .pass-input {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      color: #fff;
      padding: 12px;
      border-radius: 8px;
      font-size: 1.2rem;
      text-align: center;
      letter-spacing: 5px;
      margin-bottom: 1.5rem;
      outline: none;
    }
    .pass-input:focus { border-color: var(--primary); box-shadow: 0 0 10px rgba(0,242,255,0.2); }

    .modal-actions { display: flex; gap: 10px; justify-content: center; }

    .btn-modal {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      text-transform: uppercase;
    }
    .btn-confirm { background: var(--primary); color: #000; }
    .btn-cancel { background: #333; color: #fff; }

    
    #upload-area {
      display: none; 
      margin-top: 15px;
      text-align: center;
      padding: 25px;
      border: 2px dashed var(--primary);
      border-radius: 12px;
      background: rgba(0, 242, 255, 0.05);
      animation: fadeIn 0.5s ease;
    }
    
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

    #file-input { display: none; }
    
    .upload-label {
      cursor: pointer;
      color: var(--primary);
      font-weight: 700;
      text-transform: uppercase;
      display: block;
      padding: 15px;
      transition: 0.3s;
      border: 1px solid transparent;
    }
    .upload-label:hover { background: rgba(0, 242, 255, 0.1); border-radius: 8px; border-color: var(--primary); }

  
    .chat-sidebar {
      background: rgba(10, 10, 15, 0.6);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      height: 600px; 
      overflow: hidden;
    }

    .chat-header {
      padding: 15px 20px;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.9rem;
      letter-spacing: 1px;
      display: flex;
      justify-content: space-between;
    }

    .chat-messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .chat-messages::-webkit-scrollbar { width: 6px; }
    .chat-messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }

    .message { font-size: 0.9rem; line-height: 1.4; }
    .user-name { font-weight: 700; color: var(--primary); margin-right: 8px; }
    .user-name.mod { color: var(--secondary); }

    .chat-input-area {
      padding: 15px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
    }

    .chat-input {
      flex: 1;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 10px 15px;
      color: #fff;
      font-family: inherit;
    }
    .chat-input:focus { outline: none; border-color: var(--primary); }

    .send-btn {
      background: var(--primary);
      border: none;
      width: 40px; height: 40px;
      border-radius: 50%;
      color: #000;
      cursor: pointer;
      transition: 0.2s;
    }
    .send-btn:hover { transform: scale(1.1); }

    
    @media (max-width: 900px) {
      .live-grid { grid-template-columns: 1fr; }
      .chat-sidebar { height: 400px; }
    }
    @media (max-width: 768px) {
      .nav-links { display: none; position: fixed; top: 80px; left: 0; right: 0; bottom: 0; background: #050508; flex-direction: column; justify-content: center; align-items: center; gap: 2rem; font-size: 1.5rem; }
      .nav-links.active { display: flex; }
      .menu-btn { display: block; z-index: 1001; }
    }
  </style>
</head>
<body>

  
  <div class="modal-overlay" id="passwordModal">
    <div class="modal-box">
      <h3><i class="fa-solid fa-lock"></i> Admin Access</h3>
      <p style="color:#888; margin-bottom:10px; font-size:0.9rem;">Enter password to manage stream</p>
      <input type="password" id="adminPassword" class="pass-input" placeholder="****" maxlength="4">
      <div class="modal-actions">
        <button class="btn-modal btn-cancel" onclick="closeModal()">Cancel</button>
        <button class="btn-modal btn-confirm" onclick="checkPassword()">Unlock</button>
      </div>
    </div>
  </div>

  <nav class="navbar">
    <a href="exe.html" class="brand">
      <img src="https://imgs.search.brave.com/cxrra9e2OP7r6lZV61g7_3MD09zel7UkcqhNJ2MX9Jk/rs:fit:500:0:1:0/g:ce/aHR0cHM6Ly93d3cu/bHVkd2lnLWRydW1z/LmNvbS9hcHBsaWNh/dGlvbi9maWxlcy82/OTE0LzYzNTEvNDE0/MC90aHVtYi1zbmFy/ZXMtbGVnYWN5Lmpw/Zw">
      <span class="brand-text">DANY DRUMMER</span>
    </a>

    <button class="menu-btn" onclick="toggleMenu()">
      <i class="fa-solid fa-bars"></i>
    </button>

    <ul class="nav-links" id="navLinks">
      <li><a href="church.html">Home</a></li>
      <li><a href="liv.html" class="active">Live</a></li>
      <li><a href="gllery.html">Gallery</a></li>
      <li><a href="cont.html">Contact</a></li>
    </ul>
  </nav>

  
  <div class="live-container">
    
    <div class="live-grid">
     
      <div class="main-content">
        <div class="video-wrapper">
          <div class="live-badge">
            <div class="live-dot"></div> <span id="live-text">Live</span>
          </div>

          <video id="local-video-player" controls autoplay loop></video>

          <div id="stream-placeholder">
             <i class="fa-brands fa-youtube" style="font-size: 4rem; margin-bottom: 1rem;"></i>
             <p>Stream Offline</p>
             <p style="font-size:0.8rem; margin-top:10px; color:#666;">(Restoring previous stream...)</p>
          </div>
        </div>

        <div class="stream-info">
          <h1 class="stream-title">PRIVATE SESSION</h1>
          
          <div class="stream-meta">
            <span class="view-count"><i class="fa-solid fa-eye"></i> <span id="viewer-count">0</span> watching</span>
            
            <button class="broadcast-btn" id="streamBtn" onclick="openPasswordModal()">
              <i class="fa-solid fa-video"></i> Broadcast Source
            </button>
          </div>

          <div id="upload-area">
            <p style="color:#fff; margin-bottom:10px;">Access Granted. Select Video File:</p>
            <label for="file-input" class="upload-label">
              <i class="fa-solid fa-cloud-arrow-up"></i> Click to Upload Video
            </label>
            <input type="file" id="file-input" accept="video/*" onchange="playUploadedVideo(event)">
          </div>
        </div>
      </div>

      <div class="chat-sidebar">
        <div class="chat-header">
          <span>Top Chat</span>
          <i class="fa-solid fa-ellipsis-vertical" style="cursor:pointer;"></i>
        </div>
        
        <div class="chat-messages" id="chatMessages">
          <div class="message"><span class="user-name mod">System</span> Waiting for broadcast...</div>
        </div>

        <div class="chat-input-area">
          <input type="text" class="chat-input" placeholder="Say something...">
          <button class="send-btn"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
      </div>
    </div>

  </div>

  <script>
    
    let db;
    const DB_NAME = "DanyStreamDB";
    const DB_VERSION = 1;
    const STORE_NAME = "videos";

   
    const request = indexedDB.open(DB_NAME, DB_VERSION);

    request.onupgradeneeded = (event) => {
      db = event.target.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) {
        db.createObjectStore(STORE_NAME);
      }
    };

    request.onsuccess = (event) => {
      db = event.target.result;
    
      loadSavedVideo();
    };

    request.onerror = (event) => {
      console.error("Database error: " + event.target.errorCode);
    };

  
    function saveVideoToDB(file) {
      const transaction = db.transaction([STORE_NAME], "readwrite");
      const store = transaction.objectStore(STORE_NAME);
      
      const request = store.put(file, "mainVideo");
      
      request.onsuccess = () => {
        console.log("Video saved to database.");
      };
    }

    
    function loadSavedVideo() {
      const transaction = db.transaction([STORE_NAME], "readonly");
      const store = transaction.objectStore(STORE_NAME);
      const request = store.get("mainVideo");

      request.onsuccess = () => {
        const file = request.result;
        if (file) {
          
          const videoURL = URL.createObjectURL(file);
          const player = document.getElementById('local-video-player');
          const placeholder = document.getElementById('stream-placeholder');
          const liveBadgeText = document.getElementById('live-text');
          const btn = document.getElementById('streamBtn');

          player.src = videoURL;
          placeholder.style.display = 'none';
          player.style.display = 'block';
          player.play();

          liveBadgeText.innerText = "Private Feed";
          liveBadgeText.style.color = "#00f2ff";
          btn.innerHTML = '<i class="fa-solid fa-rotate"></i> Change Stream';

          addSystemMessage("Previous stream restored automatically.");
        }
      };
    }

    
    function playUploadedVideo(event) {
      const file = event.target.files[0];
      if (file) {
       
        const videoURL = URL.createObjectURL(file);
        const player = document.getElementById('local-video-player');
        const placeholder = document.getElementById('stream-placeholder');
        const liveBadgeText = document.getElementById('live-text');
        const btn = document.getElementById('streamBtn');
        const uploadArea = document.getElementById('upload-area');

        player.src = videoURL;
        placeholder.style.display = 'none';
        player.style.display = 'block';
        player.play();

        liveBadgeText.innerText = "Private Feed";
        liveBadgeText.style.color = "#00f2ff";

        
        uploadArea.style.display = 'none';
        btn.innerHTML = '<i class="fa-solid fa-rotate"></i> Change Stream';

        
        saveVideoToDB(file);

        addSystemMessage("New video uploaded and saved.");
      }
    }

    function addSystemMessage(text) {
      const chatBox = document.getElementById('chatMessages');
      const sysMsg = document.createElement('div');
      sysMsg.className = 'message';
      sysMsg.innerHTML = '<span class="user-name mod">System</span> ' + text;
      chatBox.appendChild(sysMsg);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    
    function openPasswordModal() {
      document.getElementById('passwordModal').style.display = 'flex';
      document.getElementById('adminPassword').value = ''; 
      document.getElementById('adminPassword').focus();
    }

    function closeModal() {
      document.getElementById('passwordModal').style.display = 'none';
    }

    function checkPassword() {
      const inputPass = document.getElementById('adminPassword').value;
      if (inputPass === "0340") {
        closeModal();
        const uploadArea = document.getElementById('upload-area');
        if (uploadArea.style.display === 'block') {
          uploadArea.style.display = 'none';
        } else {
          uploadArea.style.display = 'block';
          uploadArea.scrollIntoView({ behavior: 'smooth' });
        }
      } else {
        alert("Incorrect Password!");
        document.getElementById('adminPassword').value = '';
      }
    }

    
    function toggleMenu() {
      const nav = document.getElementById('navLinks');
      const icon = document.querySelector('.menu-btn i');
      nav.classList.toggle('active');
      if (nav.classList.contains('active')) {
        icon.classList.remove('fa-bars');
        icon.classList.add('fa-xmark');
      } else {
        icon.classList.remove('fa-xmark');
        icon.classList.add('fa-bars');
      }
    }

   
    let viewers = 120;
    setInterval(() => {
      viewers += Math.floor(Math.random() * 5) - 2;
      document.getElementById('viewer-count').innerText = viewers;
    }, 3000);

    document.getElementById("adminPassword").addEventListener("keypress", function(event) {
      if (event.key === "Enter") checkPassword();
    });
  </script>

</body>
</html>
